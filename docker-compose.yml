# Rauhan's Toolhub — application stack.
#
# TLS and routing are NOT here; they belong to the shared edge proxy in
# ./infra, which must be running first (it owns the `edge` network).
#
# Nothing in this stack publishes a port. The app is reachable only through
# Caddy on `edge`; metube and warp sit on `backend` and are unreachable from
# outside the host entirely.

name: toolhub

# Docker's default json-file driver never rotates, so every container's log
# grows until the disk fills. Three 10 MB files each is plenty to debug with.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    # CI builds this and pushes it to GHCR; the VPS only ever pulls, so deploys
    # don't spend the box's 2 OCPUs compiling Next.js.
    image: ${TOOLHUB_IMAGE:-ghcr.io/rauhan-sheikh/toolhub:latest}
    # Used by `docker compose build` locally; ignored by `docker compose pull`.
    build: .
    # Explicit, because Caddy addresses this by name across projects and a bare
    # `web` would collide with the next project that has a `web` service.
    container_name: toolhub-web
    restart: unless-stopped
    logging: *logging
    # Ceilings against a runaway, not tuning — the app idles well under these.
    # The Dockerfile caps the V8 heap to match.
    mem_limit: 512m
    env_file: .env
    volumes:
      # Finished downloads. The app streams these to the browser and deletes
      # them on request; MeTube has no per-item file-delete API, only a global
      # flag that would make every list removal destructive.
      - ./downloads:/downloads
    depends_on:
      - metube
    networks:
      - edge
      - backend

  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: toolhub-metube
    restart: unless-stopped
    logging: *logging
    # ffmpeg merges are the heaviest thing on the box; leave room for them.
    mem_limit: 2g
    volumes:
      - ./downloads:/downloads
      - metube-state:/state
    environment:
      # MeTube starts as root and drops to PUID/PGID itself; setting `user:`
      # directly would pre-empt that and break its own setup.
      #
      # Don't assume 1000 is you. On Oracle's Ubuntu image uid 1000 is `opc`
      # and the login user `ubuntu` is 1001, so downloads would land owned by
      # someone else. Check with `id -u` and set PUID/PGID in .env.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      STATE_DIR: /state
      # Each download is yt-dlp plus an ffmpeg merge; the default of 3 at once
      # contends for the box's 2 OCPUs.
      MAX_CONCURRENT_DOWNLOADS: 2
      LOGLEVEL: WARNING
      # Route yt-dlp's traffic through Cloudflare WARP. YouTube blocks requests
      # straight from cloud IP ranges (Oracle included) with "Sign in to confirm
      # you're not a bot"; WARP egress is not treated that way.
      YTDL_OPTIONS: '{"proxy":"socks5://warp:1080"}'
    depends_on:
      warp:
        condition: service_healthy
    networks:
      - backend

  warp:
    image: caomingjun/warp
    container_name: toolhub-warp
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    environment:
      WARP_SLEEP: 2
    # Required for the WireGuard tunnel the container brings up internally.
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    # Gates metube's start (service_healthy), so it checks every 5 s while
    # starting; after that it's informational and every 5 min is enough.
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fs https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'"]
      interval: 5m
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    networks:
      - backend

networks:
  # Owned by the infra stack — bring that up first.
  edge:
    name: edge
    external: true
  # Not marked `internal: true` — WARP needs outbound internet. It simply
  # publishes no ports, so metube and warp are unreachable from outside.
  backend:

volumes:
  metube-state:
  warp-data:
