name: Build and deploy

on:
  push:
    branches: [main]
    # Nothing in these ends up in the image. infra/ is applied to the box by
    # hand (see DEPLOY.md), so rebuilding and restarting the app for it — or
    # for a docs edit — only churns the VPS.
    paths-ignore:
      - "**/*.md"
      - "infra/**"
      - ".env.example"
  workflow_dispatch:

# A second push while a deploy is mid-flight would race it onto the box.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # Native arm64 so the image matches Oracle's Ampere shape. These runners
    # became available for private repos in Jan 2026 and are free-tier eligible;
    # the alternative, QEMU cross-building, is painfully slow for a Next.js app.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: name
        # GHCR rejects uppercase; repository names don't guarantee lowercase.
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `latest` is what the server pulls; the SHA tag exists so you can pin
          # or roll back to a specific commit by hand.
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart on the VPS
        uses: appleboy/ssh-action@v1
        env:
          # Short-lived, job-scoped token. Deliberately not a long-lived PAT
          # sitting on the box — it's logged out again at the end of the script.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/toolhub
            # The image carries the code, but docker-compose.yml lives in this
            # checkout; without a pull, compose changes never reach the box.
            if [ -d .git ]; then git pull --ff-only; fi
            docker compose pull web
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f

      - name: Verify the app came back up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            for i in $(seq 1 20); do
              if docker exec toolhub-web wget -q -O /dev/null http://127.0.0.1:3000/api/health; then
                echo "healthy after ${i} attempt(s)"
                exit 0
              fi
              sleep 3
            done
            echo "app did not become healthy; recent logs:"
            docker compose -f ~/toolhub/docker-compose.yml logs --tail 50 web
            exit 1
